main:
  - title: 'SIGNAL: A Scalable, Real-World Model for Rapid Intraoperative Molecular Classification of Gliomas Using Stimulated Raman Histology'
    authors: Nicolas K Goff, John E Markert, David Reinecke, Alexandra Springer, Anna M Chen, Minjun Park, Gabrielle Malte, Katie Scotford-Broemmer, Sophia Hoonsbeen, Karen Eddy, Asadur Chowdury, Cheng Jiang, Akhil Kondepudi, Anna-Katharina Meissner, Gina Fürtjes, Nina Müller, Volker Neuschmelting, Melike Pekmezci, Jacob Young, Christian Freudinger, Matija Snuderl, Mitchel Berger, Shawn Hervey-Jumper, John G. Golfinos, Todd C. Hollon, and Daniel A. Orringer
    conference: medRxiv 2026
    description: >
      **SIGNAL** is a scalable model for rapid intraoperative molecular classification of gliomas from stimulated Raman histology, with attention-guided patch visualization that separates tumor from non-tumor tissue and distinguishes GBM, oligodendroglioma, and astrocytoma in real-world surgical settings.
