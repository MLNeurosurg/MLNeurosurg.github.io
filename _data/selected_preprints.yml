main:
  - title: 'A frontier machine intelligence for human neuroimaging'
    authors: Chenhui Zhao, Akshay Rao, Akhil Kondepudi, Yiwei Lyu, Xinhai Hou, Rikhil Seshadri, Cheng Jiang, Soumyanil Banerjee, Rushikesh Joshi, Samir Harake, Ashok Srinivasan, Shruti Mishra, Francisco Rivas-Rodriguez, Seunghong Rhee, Nathaniel Roddenberry, Neeraj Chaudhary, Zach Wilseck, Paul Park, Honglak Lee, Vikas Gulani, Aditya Pandey, and Todd Hollon
    conference: arXiv 2026
    description: >
      **Neuro-VL** is a vision-language model trained on nearly one million neuroimaging studies from routine clinical care. It interprets complete imaging studies, converses about findings, generates radiology reports, monitors disease across serial exams, and outperforms frontier general-purpose and medical models across international evaluation on 6 continents.
